version: "3.9"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: edossier_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: edossier
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: edossier
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edossier"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edossier_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8090"
      APP_ENV: development
      DATABASE_URL: postgres://edossier:secret@postgres:5432/edossier?sslmode=disable
      JWT_SECRET: dev-secret-key-replace-in-production-must-be-long
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      LOG_LEVEL: debug
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFE: 5m
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
