paths:
  /attendance/personnel:
    post:
      consumes:
      - application/json
      description: Record attendance for personnel
      parameters:
      - description: Attendance info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PersonnelAttendanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PersonnelAttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Record personnel attendance
      tags:
      - attendance
  /attendance/personnel/{id}:
    delete:
      description: Delete a personnel attendance record
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Delete personnel attendance
      tags:
      - attendance
    get:
      description: Get a personnel attendance record by ID
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PersonnelAttendanceResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Get personnel attendance
      tags:
      - attendance
    put:
      consumes:
      - application/json
      description: Update personnel attendance record
      parameters:
      - description: Attendance ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated attendance info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePersonnelAttendanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PersonnelAttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apperror.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Update personnel attendance
      tags:
      - attendance
  /attendance/personnel/{id}/range:
    get:
      description: List personnel attendance for a date range
      parameters:
      - description: Personnel ID
        in: path
        name: id
        required: true
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.PersonnelAttendanceResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: List personnel attendance by range
      tags:
      - attendance
